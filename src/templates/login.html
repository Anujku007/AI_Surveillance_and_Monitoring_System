<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Surveillance System — Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-icon">🛡</div>
    <h1>AI Surveillance System</h1>
    <p class="login-subtitle">
      {% if first_time %}First-time setup — create the first admin account{% else %}Login{% endif %}
    </p>

    <form method="POST" class="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label>Username</label>
      <input type="text" name="username" autofocus required>

      <label>Password</label>
      <input type="password" name="password" required>

      {% if first_time %}
      <label>Confirm Password</label>
      <input type="password" name="confirm" required>
      {% endif %}

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <button type="submit">{% if first_time %}Create Admin Account{% else %}Login{% endif %}</button>
    </form>
  </div>
</body>
</html>
